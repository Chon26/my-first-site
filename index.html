<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เรียนกิตฮับ</title>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #fdf6ec, #ffe8d6);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .card {
      background: white;
      padding: 40px 50px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }
    h1 {
      color: #d2691e;
      margin-bottom: 10px;
    }
    p {
      color: #555;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎉 สวัสดีชาวเพื่อน!</h1>
    <p>นี่คือเว็บไซต์แรกของฉันที่ deploy ด้วย GitHubแก้ไขแล้วจ้า</p>
  </div>
</body>
</html>
